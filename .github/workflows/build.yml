# Пересобирает страницы после правок в админке (Pages CMS) или в данных.
name: Сборка сайта
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/img/uploads/**"
      - "assets/video/uploads/**"
      - "build.js"
      - ".github/workflows/build.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать страницы
        run: node build.js
      - name: Проверить ссылки
        run: node check-links.js
      - name: Закоммитить результат
        run: |
          git config user.name "portfolio-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Автосборка после правок в админке"
          git pull --rebase
          git push
